<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gallery</title>
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: #111;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }
    video {
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
    }
    /* Fullscreen overlay */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #overlay video {
      width: 90%;
      max-height: 90%;
      border-radius: 12px;
    }
    #overlay span {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Grid of videos -->
  <video src="5_6071188121188309695.mp4" autoplay muted loop playsinline onclick="zoomVideo(this.src)"></video>

<video src="5_6194862653664401339.mp4" autoplay muted loop playsinline onclick="zoomVideo(this.src)"></video>

  <!-- Overlay fullscreen player -->
  <div id="overlay">
    <span onclick="closeOverlay()">✖</span>
    <video id="overlayVideo" controls autoplay muted loop></video>
  </div>

  <script>
    function zoomVideo(src) {
      const overlay = document.getElementById("overlay");
      const overlayVideo = document.getElementById("overlayVideo");
      overlay.style.display = "flex";
      overlayVideo.src = src;
      overlayVideo.play();
    }

    function closeOverlay() {
      const overlay = document.getElementById("overlay");
      const overlayVideo = document.getElementById("overlayVideo");
      overlay.style.display = "none";
      overlayVideo.pause();
      overlayVideo.src = ""; // clear to stop sound
    }
  </script>

</body>
